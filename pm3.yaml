version: 1
name: zentala-agency
description: zentala.agency marketing site (Astro dev server, served from the dev worktree; http://agency.internal on mATX, http://agency.matx.lan:4300 from other computers on the LAN or VPN)

services:
  - name: dev
    description: Astro dev server for zentala.agency
    cwd: .
    cmd: [node, node_modules/astro/astro.js, dev, --port, '4300', --host]
    port: 4300
    domain: agency.internal
    health: { type: http, port: 4300 }
    env:
      NODE_ENV: development
      PORT: '4300'
      DEV_LAN_HOST: agency.matx.lan
      PUBLIC_AGENTATION_REVIEW: '1'
