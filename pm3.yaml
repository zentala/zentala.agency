version: 1
name: zentala-agency
description: zentala.agency marketing site (Astro dev server on mITX, http://agency.internal)

services:
  - name: dev
    description: Astro dev server for zentala.agency
    cwd: .
    cmd: [node, node_modules/astro/astro.js, dev, --port, '4300', --host]
    port: 4300
    domain: agency.internal
    health: { type: http, port: 4300 }
    env:
      NODE_ENV: development
      PORT: '4300'
      PUBLIC_AGENTATION_REVIEW: '1'
